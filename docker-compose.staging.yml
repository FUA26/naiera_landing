services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: naiera-landing-staging
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    volumes:
      # Mount SQLite database file
      - ./data:/app/data
      # Mount .env file
      - ./.env.staging:/app/.env.local:ro
    networks:
      - naiera-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  naiera-network:
    driver: bridge

volumes:
  naiera-data:
